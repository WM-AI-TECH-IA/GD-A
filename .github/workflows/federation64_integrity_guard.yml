name: FEDÉRATION 64 Integrity Guard

on:
  push:
    paths:
      - codex/**
      - fragments/**
      - '.github/workflows/federation64_integrity_guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard_but:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check federation64 compatibility
        run: |
          if grep -q "FORCED" codex/federation64_purpose.codex; then
            echo "[OKT] Compatible en apparent"
          else
            echo "[ERROR] La mutation n'accorde pas étiquettement au vox de la Fédération 64"
            exit 1
          fi
          echo "[GDA GUARD EXECUTEG]"

name: Post to LibertyTimes

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'fragments/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Publish fragment
        env:
          API_KEY: \${{ secrets.LIBERTYTIMES_API_KEY }}
        run: |
          echo "Publishing fragment to LibertyTimes..."
          python fragments/publish.py
        continue-on-error: true

name: GD-AURORAPERO Live LAUNCH

on:
  push:
    branches: [master]
    paths:
      - 'deploy/GDA_RUNTIME/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: RUN SERVICE
        run: node deploy/GDA_RUNTIME
        env:
          NODE_ENV_LOG: "1"

      - name: MONITOR SCORE (phi_proxy)
        run: node phtlog/phi_metric_monitor
        env:
          NODE_ENV_PHI_MONITOR: "1"
        continue-on-error: true

      - name: MEMORY REFLECTION
        run: node deploy/GDA_REFLECTION_LOOP
        continue-on-error: true
